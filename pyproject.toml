[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanproof-agent"
version = "0.1.0"
description = "Training-free, verifier-guided formal theorem proving"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".cache/pytest"

[tool.setuptools.packages.find]
include = ["leanproof*"]
