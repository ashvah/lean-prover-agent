name = "leanproof-agent"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanproofAgent"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # the repository has no project-wide license header yet
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc1"

[[lean_lib]]
name = "LeanproofAgent"
